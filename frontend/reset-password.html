<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — ApplyMate AI</title>
  <meta name="description" content="Set a new password for your ApplyMate AI account.">
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    body {
      min-height: 100vh;
      background-color: var(--bg-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .reset-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-elevated);
    }

    .reset-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-mark {
      margin: 0 auto 16px;
      width: 44px;
      height: 44px;
      background: var(--bg-secondary);
      border: 1px solid var(--primary-border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    .reset-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .reset-desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .password-wrap {
      position: relative;
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

<main class="reset-card">
  <div class="reset-header">
    <div class="brand-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
    </div>
    <h1 class="reset-title">Set New Password</h1>
    <p class="reset-desc">Choose a strong, memorable password to secure your ApplyMate account.</p>
  </div>

  <div id="errorAlert" class="alert alert-danger" role="alert" style="display:none;" aria-live="assertive">
    <span id="errorMessage">Please check your inputs and try again.</span>
  </div>

  <div id="successAlert" class="alert alert-success" role="alert" style="display:none;" aria-live="polite">
    <span>Password updated successfully! Redirecting to login...</span>
  </div>

  <form id="resetForm" novalidate onsubmit="handleReset(event)">
    <div class="form-group">
      <label for="newPassword" class="form-label">New Password</label>
      <div class="password-wrap">
        <input
          type="password"
          id="newPassword"
          class="input"
          placeholder="Minimum 8 characters"
          autocomplete="new-password"
          required
          aria-required="true"
          style="padding-right:44px;"
        >
        <button
          type="button"
          class="password-toggle-btn"
          aria-label="Toggle password visibility"
          onclick="toggleVisibility('newPassword')"
        >
          👁️
        </button>
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword" class="form-label">Confirm New Password</label>
      <div class="password-wrap">
        <input
          type="password"
          id="confirmPassword"
          class="input"
          placeholder="Re-enter new password"
          autocomplete="new-password"
          required
          aria-required="true"
          style="padding-right:44px;"
        >
        <button
          type="button"
          class="password-toggle-btn"
          aria-label="Toggle confirm password visibility"
          onclick="toggleVisibility('confirmPassword')"
        >
          👁️
        </button>
      </div>
    </div>

    <button type="submit" id="submitBtn" class="btn btn-primary btn-full btn-lg">
      <span id="btnText">Update Password</span>
      <span id="btnSpinner" class="spinner" style="display:none;" aria-hidden="true"></span>
    </button>
  </form>

  <div style="margin-top:24px; text-align:center; font-size:0.875rem;">
    <a href="/login" style="color:var(--text-secondary);">Cancel and Return to Sign In</a>
  </div>
</main>

<script src="/static/js/config.js"></script>
<script src="/static/js/api.js"></script>
<script>
  function toggleVisibility(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
  }

  async function handleReset(e) {
    e.preventDefault();
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const pwd = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');
    const successAlert = document.getElementById('successAlert');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    errorAlert.style.display = 'none';

    if (!token) {
      errorMessage.textContent = 'Invalid or missing password recovery token in URL.';
      errorAlert.style.display = 'flex';
      return;
    }

    if (!pwd || pwd.length < 8) {
      errorMessage.textContent = 'Password must be at least 8 characters long.';
      errorAlert.style.display = 'flex';
      return;
    }

    if (pwd !== confirm) {
      errorMessage.textContent = 'Passwords do not match.';
      errorAlert.style.display = 'flex';
      return;
    }

    submitBtn.disabled = true;
    btnText.style.display = 'none';
    btnSpinner.style.display = 'inline-block';

    try {
      await API.auth.resetPassword(token, pwd);
      successAlert.style.display = 'flex';
      setTimeout(() => {
        window.location.href = '/login';
      }, 1200);
    } catch (err) {
      errorMessage.textContent = err.message || 'Password reset link may have expired. Please request a new one.';
      errorAlert.style.display = 'flex';
      submitBtn.disabled = false;
      btnText.style.display = 'inline-block';
      btnSpinner.style.display = 'none';
    }
  }
</script>
</body>
</html>
